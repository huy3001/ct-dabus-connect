name: CI

on:
  push:
  pull_request:

jobs:
  validate-connect-app:
    name: Validate ${{ matrix.application }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        application:
          - event
          - service
    defaults:
      run:
        working-directory: ${{ matrix.application }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install modules
        run: npm ci
      - name: Audit production and development dependencies
        run: npm audit --audit-level=low
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Test
        run: npm run test -- --runInBand
