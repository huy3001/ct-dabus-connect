openapi: 3.0.0
info:
  title: 'Dabus API Specification'
  description: 'REST API Specification in OpenAPI 3 format'
  license:
    name: Commercial
  version: 2.0.1
servers:
  -
    url: '{base_url}/{api_version}/{sandbox}/{system_code}'
    variables:
      base_url:
        default: 'http://127.0.0.1:4000'
        description: 'The base url.'
      api_version:
        enum:
          - v1
        default: v1
        description: 'The Dabus API version.'
      sandbox:
        default: commercetools
        description: 'The sandbox.'
      system_code:
        default: test-b2b-project
        description: 'The system code.'
paths:
  /attributes:
    get:
      tags:
        - AttributeRepositoryV1
      summary: 'Search for attributes'
      description: 'Use parameters to paginate through attribute results.'
      operationId: AttributeRepositoryV1Search
      parameters:
        -
          name: delta
          in: query
          description: 'Delta descripter'
          style: deepObject
          explode: false
          schema:
            $ref: '#/components/schemas/Delta'
      responses:
        '200':
          description: 'Successful operation.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attributes'
            application/xml:
              schema:
                $ref: '#/components/schemas/Attributes'
        '400':
          description: 'Invalid code supplied.'
        '404':
          description: 'Unable to find attribute.'
      security:
        -
          'OAuth 2': []
  '/attribute/{code}':
    get:
      tags:
        - AttributeRepositoryV1
      summary: 'Find attribute by code'
      description: 'Returns a single attribute.'
      operationId: AttributeRepositoryV1Get
      parameters:
        -
          name: code
          in: path
          description: 'Code of attribute to return.'
          required: true
          schema:
            type: string
            format: code
      responses:
        '200':
          description: 'Successful operation.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attribute'
            application/xml:
              schema:
                $ref: '#/components/schemas/Attribute'
        '400':
          description: 'Invalid code supplied.'
        '404':
          description: 'Unable to find attribute.'
      security:
        -
          'OAuth 2': []
    put:
      tags:
        - AttributeRepositoryV1
      summary: 'Update attribute by code'
      description: 'Returns the single attribute updated.'
      operationId: AttributeRepositoryV1Update
      parameters:
        -
          name: code
          in: path
          description: 'Code of attribute to be upated.'
          required: true
          schema:
            type: string
      requestBody:
        description: 'Attribute data.'
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Attribute'
          application/xml:
            schema:
              $ref: '#/components/schemas/Attribute'
      responses:
        '200':
          description: 'Successful operation.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attribute'
            application/xml:
              schema:
                $ref: '#/components/schemas/Attribute'
        '400':
          description: 'Invalid attribute data supplied.'
        '404':
          description: 'Unable to find attribute.'
      security:
        -
          'OAuth 2': []
    patch:
      tags:
        - AttributeRepositoryV1
      summary: 'Partialy update attribute by code'
      description: 'Returns the single attribute patched.'
      operationId: AttributeRepositoryV1Patch
      parameters:
        -
          name: code
          in: path
          description: 'Code of attribute to be patched.'
          required: true
          schema:
            type: string
      requestBody:
        description: 'For specification and examples of patch request, please refer to RFC 5261.'
        required: true
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/XmlPatch'
      responses:
        '200':
          description: 'Successful operation.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attribute'
            application/xml:
              schema:
                $ref: '#/components/schemas/Attribute'
        '400':
          description: 'Invalid attribute patch instructions supplied.'
        '404':
          description: 'Unable to find attribute.'
      security:
        -
          'OAuth 2': []
