components:
  schemas:
    CreatedAt:
      description: 'RFC 3339, section 5.6'
      type: string
      format: date-time
      xml:
        name: CreatedAt
      example: '2019-06-11T08:40:30Z'
      nullable: false
    UpdatedAt:
      description: 'RFC 3339, section 5.6'
      type: string
      format: date-time
      xml:
        name: UpdatedAt
      example: '2019-06-11T08:40:30Z'
      nullable: false
    AttributeOptions:
      title: AttributeOptions
      description: 'Attribute Options Collection'
      type: array
      items:
        $ref: '#/components/schemas/AttributeOption'
      xml:
        name: Options
        wrapped: true
      nullable: false
    Attribute:
      title: Attribute
      description: Attribute
      required:
        - type
        - code
        - options
      properties:
        type:
          description: 'Attribute type (e.g. text, boolean, select, multi).'
          type: string
          minLength: 1
          xml:
            name: Type
          example: text
          nullable: false
        code:
          description: 'Code for the attribute.'
          type: string
          minLength: 1
          xml:
            name: Code
          nullable: false
        label:
          description: 'Label for the attribute.'
          type: string
          minLength: 1
          xml:
            name: Label
          nullable: false
        options:
          $ref: '#/components/schemas/AttributeOptions'
        created_at:
          $ref: '#/components/schemas/CreatedAt'
        updated_at:
          $ref: '#/components/schemas/UpdatedAt'
      type: object
      xml:
        name: Attribute
    AttributeOption:
      title: AttributeOption
      description: AttributeOption
      required:
        - label
        - value
      properties:
        label:
          description: 'Interface CanonicalAttributeOptionInterface.'
          type: string
          minLength: 1
          xml:
            name: Label
          nullable: false
        value:
          description: 'Interface CanonicalAttributeOptionInterface.'
          type: string
          minLength: 1
          xml:
            name: Value
          nullable: false
        created_at:
          $ref: '#/components/schemas/CreatedAt'
        updated_at:
          $ref: '#/components/schemas/UpdatedAt'
      type: object
      xml:
        name: AttributeOption
    Attributes:
      title: Attributes
      description: Attributes
      required:
        - attributes
      properties:
        attributes:
          description: 'Class CanonicalAttributes.'
          type: array
          items:
            $ref: '#/components/schemas/Attribute'
          xml:
            name: Attributes
            wrapped: false
          nullable: false
      type: object
      xml:
        name: Attributes
    BundleProductProducts:
      title: BundleProductProducts
      description: 'BundleProduct Simple Product Collection'
      type: array
      items:
        $ref: '#/components/schemas/Product'
      xml:
        name: Products
        wrapped: true
      nullable: false
    BundleProduct:
      title: BundleProduct
      description: BundleProduct
      required:
        - sku
        - name
      properties:
