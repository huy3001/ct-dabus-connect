deployAs:
  - name: service
    applicationType: service
    endpoint: /service
    scripts:
      postDeploy: npm install && npm run build && npm run connector:post-deploy
      preUndeploy: npm install && npm run build && npm run connector:pre-undeploy
    configuration:
      standardConfiguration:
        - key: CTP_REGION
          description: commercetools Composable Commerce API region
          required: true
          default: "europe-west1.gcp"
        - key: DABUS_BASE_URL
          description: Dabus API base URL including version, sandbox and system code
          required: true
        - key: DABUS_AUTH_URL
          description: Dabus AWS Cognito OAuth2 token URL
          required: true
        - key: DABUS_SCOPE
          description: Optional OAuth2 scope for Dabus authentication
          required: false
        - key: DABUS_JOB_SCHEDULES_JSON
          description: Optional JSON array overriding the stateless Dabus job schedules
          required: false
        - key: MC_APP_URL
          description: Optional public service origin used as the Merchant Center session-token audience, without the /service path
          required: false
      securedConfiguration:
        - key: CTP_PROJECT_KEY
          description: commercetools Composable Commerce project key
          required: true
        - key: CTP_CLIENT_ID
          description: commercetools Composable Commerce client ID
          required: true
        - key: CTP_CLIENT_SECRET
          description: commercetools Composable Commerce client secret
          required: true
        - key: CTP_SCOPE
          description: commercetools Composable Commerce client scope
          required: true
        - key: DABUS_WEBHOOK_SECRET
          description: Shared secret Dabus sends in the x-dabus-webhook-secret header
          required: true
        - key: DABUS_CLIENT_ID
          description: Dabus OAuth2 client ID
          required: true
        - key: DABUS_CLIENT_SECRET
          description: Dabus OAuth2 client secret
          required: true
  - name: event
    applicationType: event
    endpoint: /event
    scripts:
      postDeploy: npm install && npm run build && npm run connector:post-deploy
      preUndeploy: npm install && npm run build && npm run connector:pre-undeploy
    configuration:
      standardConfiguration:
        - key: CTP_REGION
          description: commercetools Composable Commerce API region
          required: true
          default: "europe-west1.gcp"
        - key: DABUS_BASE_URL
          description: Dabus API base URL including version, sandbox and system code, e.g. https://host/v1/commercetools/my-project
          required: true
        - key: DABUS_TOKEN_URL
          description: Dabus OAuth 2 client-credentials token URL
          required: true
        - key: DABUS_ORDER_ORIGIN
          description: Order origin value sent to Dabus for orders created in commercetools
          required: true
          default: commercetools
      securedConfiguration:
        - key: CTP_PROJECT_KEY
          description: commercetools Composable Commerce project key
          required: true
        - key: CTP_CLIENT_ID
          description: commercetools Composable Commerce client ID
          required: true
        - key: CTP_CLIENT_SECRET
          description: commercetools Composable Commerce client secret
          required: true
        - key: CTP_SCOPE
          description: commercetools Composable Commerce client scope
          required: true
        - key: DABUS_CLIENT_ID
          description: Dabus OAuth 2 client ID
          required: true
        - key: DABUS_CLIENT_SECRET
          description: Dabus OAuth 2 client secret
          required: true
